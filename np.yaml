apiVersion: hypershift.openshift.io/v1beta1
kind: NodePool
metadata:
  name: workerhcp
  namespace: test-np
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true,Validate=false
spec:
  arch: amd64
  clusterName: hcpclusternewsetup
  management:
    autoRepair: false
    replace:
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
      strategy: RollingUpdate
    upgradeType: Replace
  config:
    - name: infra-dynamic-node
